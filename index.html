<title>DuoFit</title>

<style>
:root{
  /* Тёмная тема (по умолчанию). Контраст текста: основной ≥ 14:1, подсказки ≥ 7:1. */
  --bg:#101318; --card:#181c23; --card2:#212631; --line:#2c323e; --text:#f2f4f7; --hint:#a7afbc;
  --accent:#ff7a50; --accent-text:#1f0d05; --accent-ink:#ff9370; --accent-soft:rgba(255,122,80,.14);
  --max:#7aa2ff; --max-bg:#4d7cf5; --eva:#e8457f; --ok:#3dd68c; --ok-text:#06210f; --warn:#f6b94a;
  --shadow:none; --overlay:rgba(5,7,10,.62); --ga:.26;
  --bodyC:#566074; --bodyD:#434b5c; --mOff:#5e687c; --mOffD:#4b5466; --mOn:#ff6a42; --mOn2:#ffad8f; --equip:#c9ced8; --equipD:#9aa1ae; --band:#3fbf8f; --water:#7fb8e8; --hair:#39404e;
  --r:16px; color-scheme:dark;
}
/* Светлая тема. Подсказки ≥ 5,5:1, акцентный текст ≥ 5:1. */
:root[data-theme="light"]{
  --bg:#f4f5f7; --card:#ffffff; --card2:#eef0f4; --line:#dfe3e9; --text:#14171c; --hint:#555e6c;
  --accent:#ff7a50; --accent-text:#1f0d05; --accent-ink:#c2410c; --accent-soft:rgba(255,122,80,.14);
  --max:#2f62e0; --max-bg:#3d6ff0; --eva:#d93a73; --ok:#15803d; --ok-text:#ffffff; --warn:#b45309;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04); --overlay:rgba(16,24,40,.45); --ga:.2;
  --bodyC:#c3c9d4; --bodyD:#d6dae2; --mOff:#b8bfcb; --mOffD:#cfd4dc; --mOn:#f25a30; --mOn2:#f8a488; --equip:#4a5263; --equipD:#7b8292; --band:#2aa876; --water:#5a9fd8; --hair:#8a93a6;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#f4f5f7; --card:#ffffff; --card2:#eef0f4; --line:#dfe3e9; --text:#14171c; --hint:#555e6c;
    --accent-ink:#c2410c; --max:#2f62e0; --max-bg:#3d6ff0; --eva:#d93a73; --ok:#15803d; --ok-text:#ffffff; --warn:#b45309;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04); --overlay:rgba(16,24,40,.45); --ga:.2; color-scheme:light; --bodyC:#c3c9d4; --bodyD:#d6dae2; --mOff:#b8bfcb; --mOffD:#cfd4dc; --mOn:#f25a30; --mOn2:#f8a488; --equip:#4a5263; --equipD:#7b8292; --band:#2aa876; --water:#5a9fd8; --hair:#8a93a6;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
body{background:transparent}
/* Фон в стиле обоев Telegram: бледные контурные фитнес-иконки и мягкий цветной градиент.
   Карточки сплошные, поэтому узор виден только в промежутках и не мешает читать. */
#bgpat{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
/* Узор: слой больше экрана на одну плитку и сдвигается ровно на плитку — повтор бесшовный.
   Двигается только transform, поэтому анимация не перерисовывает страницу и почти не тратит батарею. */
#bgpat:before{content:"";position:absolute;top:-320px;left:-320px;right:0;bottom:0;background-image:var(--pat);background-size:320px 320px;
  animation:patDrift 90s linear infinite;will-change:transform}
/* Цветные пятна: медленно смещаются и «дышат». */
#bgpat:after{content:"";position:absolute;inset:-20%;
  background-image:radial-gradient(55% 42% at 18% 18%,rgba(var(--g1),var(--ga)),transparent 70%),radial-gradient(52% 42% at 82% 82%,rgba(var(--g2),var(--ga)),transparent 70%);
  animation:glowFloat 22s ease-in-out infinite alternate;will-change:transform}
/* Третий цвет медленно проявляется и гаснет — так заметна смена оттенков. */
#bgpat .g3{position:absolute;inset:-20%;background-image:radial-gradient(45% 38% at 78% 25%,rgba(var(--g3),var(--ga)),transparent 70%),radial-gradient(42% 36% at 22% 78%,rgba(var(--g1),calc(var(--ga) * .8)),transparent 70%);
  animation:glowSwap 16s ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes glowSwap{0%{opacity:0;transform:translate3d(-4%,3%,0) scale(1)}100%{opacity:1;transform:translate3d(4%,-4%,0) scale(1.12)}}
@keyframes patDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(320px,320px,0)}}
@keyframes glowFloat{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(7%,-6%,0) scale(1.12)}100%{transform:translate3d(-6%,7%,0) scale(1.04)}}
:root[data-anim="off"] #bgpat:before,:root[data-anim="off"] #bgpat:after,:root[data-anim="off"] #bgpat .g3{animation:none}
:root[data-anim="off"] #bgpat .g3{opacity:.5}
@media (prefers-reduced-motion: reduce){ #bgpat:before,#bgpat:after,#bgpat .g3{animation:none} #bgpat .g3{opacity:.5} }

#app{max-width:520px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
h1{font-size:26px;line-height:1.15;margin:4px 0 8px}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 4px}
p{margin:6px 0}
.hint{color:var(--hint);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-family:inherit;font-weight:600;font-size:16px;line-height:1;background:var(--accent);color:var(--accent-text);cursor:pointer;margin-top:12px;text-align:center}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn:not(.sec):active{filter:brightness(.94)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:9px 14px;font-family:inherit;font-weight:500;font-size:14px;line-height:1;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px 14px;margin:8px 0;font-family:inherit;font-size:inherit;cursor:pointer}
.opt b{display:block;font-size:15px}
.opt span{color:var(--hint);font-size:13px}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--hint);border:1px solid var(--line)}
.badge.ai{color:var(--max);border-color:var(--max)}
.badge.pro{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;flex:none}
.av.m{background:var(--max-bg)} .av.e{background:var(--eva)}
.duo{display:flex}.duo .av+.av{margin-left:-10px;box-shadow:0 0 0 3px var(--card)}
.bubble{background:var(--card2);border-radius:14px;padding:10px 12px;font-size:14px}
.bubble b{display:block;font-size:12px;color:var(--hint);margin-bottom:2px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--hint);margin-bottom:5px}
.field input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-family:inherit;font-size:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs div{display:flex;max-width:520px;width:100%}
.tab{flex:1;border:0;background:none;color:var(--hint);font-family:inherit;font-weight:600;font-size:12px;line-height:1.2;padding:8px 2px;cursor:pointer;border-radius:10px}
.tab i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.tab.on{color:var(--accent-ink)}
.day{cursor:pointer}
.day.done{opacity:.6}
.ex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.num{width:28px;height:28px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.set{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-family:inherit;font-weight:700;font-size:14px;line-height:1;cursor:pointer}
.set.on{background:var(--ok);border-color:var(--ok);color:var(--ok-text)}
.link{background:none;border:0;color:var(--max);font-family:inherit;font-weight:600;font-size:13px;line-height:1;padding:6px 0;cursor:pointer}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 32px));background:var(--text);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;z-index:6}
.timer b{font-size:22px;font-variant-numeric:tabular-nums}
.timer button{background:var(--bg);color:var(--text);border:0;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;line-height:1;cursor:pointer}
.lock{border:1px solid var(--accent);background:linear-gradient(rgba(255,122,80,.06),rgba(255,122,80,.06)),var(--card)}
.warn{border-color:var(--warn)}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--hint)}
.list li{margin:4px 0}
ul.list{padding-left:18px;margin:6px 0}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)}
.yn{display:flex;gap:6px;flex:none}
.q{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.q:first-of-type{border-top:0}
svg.spark{width:100%;height:70px;display:block}
/* Питание */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card2);padding:4px;border-radius:12px;margin:4px 0 6px}

.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lab2{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);margin:0}
.fsum{display:grid;gap:10px}
.kcalbig{font-size:48px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kcalbig span{font-size:18px;color:var(--hint);margin-left:6px;font-weight:600}
.fsum.over .kcalbig,.fsum.over .lab2{color:var(--warn)}
.fbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.fbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.fsum.over .fbar i{background:var(--warn)}
.fmac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fmac div{background:var(--card2);border-radius:10px;padding:8px 10px}
.fmac b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.fmac span{font-size:12px;color:var(--hint)}
.fmac .p b{color:var(--accent-ink)}
.fslots{display:grid;gap:6px;margin-top:12px}
.fslots button{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;min-height:44px;cursor:pointer;padding:4px}
.fslots button.done{border-color:var(--ok);color:var(--ok)}
.fslots button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.fmeal{display:grid;gap:8px}
.fmeal h3{font-size:17px;line-height:1.2}
.mt{text-align:right;font-size:12px;color:var(--hint);white-space:nowrap;font-variant-numeric:tabular-nums}
.mt b{display:block;font-size:18px;color:var(--text)}
ul.it{list-style:none;margin:0;padding:0}
ul.it li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
ul.it li:first-child{border-top:0}
.g{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.g small{color:var(--hint);font-weight:500}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.sm2{margin:0;padding:12px 8px;font-size:15px}
.recipe{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:6px}
.recipe ol{margin:6px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.flist{padding:0;overflow:hidden}
.fli{display:flex;gap:8px;align-items:center;padding:10px 12px 10px 14px;border-top:1px solid var(--line)}
.fli:first-child{border-top:0}
.fli b{font-weight:600;overflow-wrap:anywhere}
.shopi{cursor:pointer;min-height:48px}
.shopi input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.shopi input:checked~span{color:var(--hint);text-decoration:line-through}
.xbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--hint);background:transparent;border:1px solid var(--line);border-radius:10px;min-height:40px;min-width:40px;padding:0 10px;cursor:pointer;flex:none}
.xbtn.add{color:var(--accent-ink);border-color:var(--accent)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.center{text-align:center}
.celebrate{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--overlay,rgba(0,0,0,.55));animation:fadeIn .2s ease}

.ghead b{font-size:16px}
.ghead .gi{font-size:20px;width:26px;text-align:center}
.ghead .chev{margin-left:auto;color:var(--hint);transition:transform .15s}

.exl{cursor:pointer}
.chip.cyc{display:inline-flex;align-items:center;gap:7px}
.chip.cyc:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--cc);flex:none}
.chip.cyc.on,.chip.wk.on{background:var(--cc);border-color:var(--cc);color:#14171c}

.chip.wk{background:var(--cs);border-color:var(--cb)}
.day.cy{border-left:4px solid var(--cc)}
.exl .lk{font-size:14px;opacity:.75}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.promo{padding:16px}
.promo h2{margin:6px 0 4px;font-size:21px}
.feat{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.feat li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}

.feat li b{display:block;font-size:14px}
.feat li span{color:var(--hint);font-size:13px}
.adapt{background:var(--card2);border-radius:14px;padding:12px 12px 12px;margin-top:14px}

.price-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px;font-size:14px}
.price-line b{font-size:18px;white-space:nowrap}
.mt0{margin-top:0}
.small{font-size:13px}

/* Подсказка дня: сначала ситуация (тренировка сегодня уже была, долгий перерыв), иначе — следующая из перемешанного списка.
   Номер дня считается от фиксированной даты, поэтому подсказки не повторяются, пока не закончится весь список. */
function tipList(c){
  const g=(opts().goal)||"tone", list=TIPS[c.id].concat(TIPS_GEN,TIPS_GOAL[g]||[]);
  let seed=0; for(const ch of c.id+g) seed=(seed*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const a=list.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function tipText(c){
  const t=today(), hist=S.history||[], last=hist.length?hist[hist.length-1].d:null, f=c.id==="f";
  if(last===t) return f?"Сегодня тренировка уже сделана, горжусь! Теперь отдых, вода и нормальный ужин: тело меняется, пока ты восстанавливаешься.":"Тренировка сегодня уже есть. Теперь моя любимая часть — восстановление: еда, вода, сон.";
  if(last&&daysBetween(last,t)>=7) return f?"Давно не виделись! Не переживай: начни сегодня с разминки и возьми вес чуть легче, чем в прошлый раз.":"Неделя без тренировок — не катастрофа. Начнём с того места, где остановились, только вес сегодня возьми чуть легче.";
  const a=tipList(c), day=Math.floor((new Date(t+"T12:00:00")-new Date("2025-01-01T12:00:00"))/864e5);
  return a[((day%a.length)+a.length)%a.length];
}

function buildProgram(){

    split.forEach((code,d)=>{

      const tpl=DAYS[code]; let slots=tpl.s.slice();

        slots=slots.map(x=>x==="bi"||x==="lat"?"rear":x).filter(x=>x!=="tri");
        if(!slots.includes("rear")) slots.splice(slots.includes("core")?slots.indexOf("core"):slots.length,0,"rear");
        if(!slots.includes("core")) slots.push("core");
      }
      if((o.goal==="back"||(o.sex==="f"&&o.goal!=="gain"))&&!slots.includes("glute")&&(code==="A"||code==="C")) slots.splice(slots.indexOf("core"),0,"glute");
      if(o.goal==="lose"||o.obese) slots.push("cardio");
      if(o.goal==="back") slots.push("mob");
      if(o.goal==="flex"&&o.weak){ const last=slots[slots.length-1]; if(!slots.includes(o.weak.slot)||code!=="FB") slots.splice(slots.length-1,0,o.weak.slot); }

        const e=pick(slot,o,variant,key,usedFam);

    const pool=items.filter(it=>!it.timed&&!it.flex);
    let c=pool.filter(it=>iso(it)&&it.sets>2).sort((a,b)=>b.sets-a.sets)[0]
        ||pool.filter(it=>it.sets>3).sort((a,b)=>b.sets-a.sets)[0];
    if(c){ c.sets--; c.trim=1; continue; }
    // убирать можно только второстепенное: руки и дельты; ягодицы у женщин и при цели «спина», задние дельты при «спине» — ключевые

    const acc=items.map((it,i)=>[it,i]).filter(([it])=>iso(it)&&!keep.has(EXI[it.id].slot)&&!keep.has(it.ps));

function calc(){
  const f=S.full; if(!f) return null;
  const h=f.height/100, bmi=f.weight/(h*h);
  const bmr=10*f.weight+6.25*f.height-5*f.age+(f.sex==="m"?5:-161);
  const act=f.days<=3?1.375:1.55, tdee=bmr*act;
  const g=opts().goal, k=GOAL_K[g]||1;  // при ИМТ ниже нормы дефицита нет
  const minKcal=f.sex==="m"?1500:1200;                       // безопасный минимум
  const raw=Math.max(Math.round(bmr*1.1/10)*10, Math.round(tdee*k/10)*10);
  const kcal=Math.max(minKcal,raw), floored=raw<minKcal;
  const protW=Math.min(f.weight,27*h*h);                    // белок считаем от веса без избытка
  const prot=Math.round(protW*(GOAL_P[g]||1.6)), fat=Math.round(Math.max(protW*0.8,kcal*0.25/9));

/* ---------- Прогноз цели по весу ----------

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

function liftGains(){
  const first={}, last={};
  S.history.forEach(h=>(h.ex||[]).forEach(x=>{ const kg=parseFloat(String(x.kg||"").replace(",",".")); if(!(kg>0)||!LOAD[x.id]) return;
    if(!first[x.id]) first[x.id]={kg,d:h.d}; last[x.id]={kg,d:h.d}; }));
  return Object.keys(first).map(id=>({id,from:first[id].kg,to:last[id].kg,d:first[id].d})).filter(x=>x.to>x.from)
    .sort((a,b)=>b.to/b.from-a.to/a.from).slice(0,3);
}

   "Сними с огня, вынь лавровый лист и дай настояться 5 минут. Подавай с зеленью."]},
 {id:"lentil_soup",n:"Суп-пюре из красной чечевицы",m:["l","d"],t:35,ing:[["lentils",70],["carrot",60],["onion",40],["potato",100],["tomato",100],["garlic",3],["sunoil",7],["bread",40]],
  steps:["Промой чечевицу до прозрачной воды. Лук и морковь мелко нарежь, картофель — кубиком.",
   "В кастрюле разогрей подсолнечное масло и обжарь лук и морковь на среднем огне 4–5 минут до мягкости. Добавь чеснок и по 1/2 чайной ложки зиры и паприки, жарь 30 секунд.",
   "Добавь чечевицу, картофель, нарезанный помидор и 600 мл горячей воды. Посоли.",
   "Вари на слабом огне под приоткрытой крышкой 20 минут, пока чечевица полностью не разварится.",
   "Измельчи суп погружным блендером до пюре. Если получилось слишком густо, добавь горячей воды.",
   "По желанию сбрызни лимонным соком. Подавай с хлебом."]},
 {id:"bulgur_beef",n:"Булгур с говядиной и овощами",m:["l","d"],t:40,ing:[["bulgur",70],["beef",130],["zucchini",120],["pepper",80],["onion",30],["garlic",3],["sunoil",8]],
  steps:["Для быстрой жарки бери мягкую часть: толстый край или верхний край лопатки. Нарежь говядину поперёк волокон тонкими полосками 5 мм.",
   "Булгур обжарь на сухой сковороде 1 минуту, залей кипятком 1 к 2, посоли и томи под крышкой на слабом огне 12–15 минут.",
   "Разогрей подсолнечное масло на сильном огне. Обжарь мясо в один слой 3–4 минуты до румяности. Не перекладывай слишком много сразу, иначе мясо начнёт тушиться.",
   "Добавь нарезанный лук и чеснок, жарь 2 минуты.",
   "Добавь кабачок и перец кубиком, посоли, поперчи и готовь 5–6 минут до мягкости овощей.",
   "Подавай с булгуром."]},
 {id:"plov",n:"Плов с курицей",m:["l"],t:55,ing:[["rice",70],["thigh",140],["carrot",80],["onion",40],["garlic",10],["sunoil",10]],
  steps:["Возьми длиннозёрный рис или специальный рис для плова. Промой его 5–6 раз до прозрачной воды.",
   "Бёдра нарежь кусками по 3–4 см. Лук нарежь полукольцами, морковь — толстой соломкой. Тереть морковь на тёрке не нужно.",
   "В казане или кастрюле с толстым дном разогрей подсолнечное масло на сильном огне. Обжарь курицу 5–6 минут до румяности.",
   "Добавь лук, жарь 3 минуты, затем морковь, жарь ещё 5 минут. Посоли и добавь по 1/2 чайной ложки зиры и куркумы.",
   "Разровняй сверху рис, не перемешивая. Аккуратно влей кипяток, чтобы он покрыл рис на 1,5 см. В центр вдави неочищенную головку чеснока.",
   "Вари на среднем огне без крышки, пока вода не впитается до уровня риса.",
   "Убавь огонь до минимума, сделай деревянной ложкой несколько проколов до дна, плотно накрой крышкой и томи 20 минут. Затем перемешай и подавай."]},
 {id:"pollock_potato",n:"Минтай, запечённый с картофелем, и салат из капусты",m:["l","d"],t:45,ing:[["potato",250],["pollock",200],["cabbage",100],["carrot",50],["lemon",10],["sunoil",10]],
  steps:["Разогрей духовку до 200 °C.",
   "Картофель нарежь дольками, смешай с половиной подсолнечного масла, солью и паприкой, выложи на противень с бумагой и запекай 20 минут.",
   "Филе минтая разморозь в холодильнике, обсуши полотенцем, посоли, поперчи и сбрызни лимонным соком.",
   "Сдвинь картофель и выложи рыбу на противень. Запекай ещё 15 минут, пока рыба не станет белой и не начнёт расслаиваться.",
   "Капусту тонко нашинкуй, посоли и помни руками 1 минуту, чтобы пустила сок. Добавь тёртую морковь, оставшееся масло и каплю лимонного сока или уксуса.",
   "Подавай рыбу с картофелем и салатом."]},
 {id:"salmon_rice",n:"Лосось с рисом и брокколи",m:["l","d"],t:30,ing:[["rice",60],["salmon",130],["broccoli",150],["lemon",10]],
  steps:["Разогрей духовку до 190 °C. Поставь вариться рис: 1 к 1,5 с водой, 15 минут на слабом огне под крышкой и 5 минут отдыха.",
   "Лосось обсуши полотенцем, посоли, поперчи и сбрызни лимонным соком.",
   "Выложи рыбу кожей вниз на противень с бумагой и запекай 12–15 минут. Готовый лосось легко расслаивается вилкой, а в центре чуть розовый.",
   "Брокколи разбери на соцветия и приготовь на пару 5–6 минут или отвари в подсоленной воде 3–4 минуты. Она должна остаться ярко-зелёной.",
   "Подавай лосось с рисом и брокколи, сбрызнув лимоном. Масло не нужно: лосось достаточно жирный."]},
 {id:"chickpea_stew",n:"Тушёный нут с томатами и шпинатом",m:["l","d"],t:30,ing:[["chickpeas",200],["tomato",150],["onion",40],["garlic",5],["spinach",40],["rice",50],["olive",7]],
  steps:["Поставь вариться рис: 1 к 1,5 с водой, 15 минут на слабом огне под крышкой.",
   "Слей жидкость с консервированного нута и промой его.",
   "Лук мелко нарежь, чеснок — тонко. Помидоры нарежь кубиком или возьми томаты в собственном соку.",
   "Разогрей оливковое масло на среднем огне, обжарь лук 4 минуты до прозрачности, добавь чеснок и по 1/2 чайной ложки зиры и копчёной паприки, жарь 30 секунд.",
   "Добавь помидоры и нут, посоли, туши под крышкой 10 минут, иногда помешивая.",
   "В конце добавь шпинат и перемешай, пока он не опадёт. Подавай с рисом."]},
 {id:"turkey_patties",n:"Котлеты из индейки с гречкой и огурцом",m:["l","d"],t:40,ing:[["turkey_mince",150],["onion",30],["buckwheat",60],["cucumber",100],["sunoil",5]],
  steps:["Поставь вариться гречку: 1 к 2 с водой, 15 минут на слабом огне под крышкой.",
   "Натри лук на мелкой тёрке вместе с соком: так котлеты будут сочными без хлеба и яиц.",
   "Смешай фарш с луком, 1/2 чайной ложки соли и перцем. Отбей фарш: бросай его в миску 10–15 раз, так котлеты не развалятся.",
   "Мокрыми руками сформируй 3–4 котлеты толщиной 2 см.",
   "Разогрей подсолнечное масло на среднем огне и обжарь котлеты по 2 минуты с каждой стороны до корочки.",
   "Влей 50 мл воды, накрой крышкой и туши на слабом огне 10–12 минут. Сок при проколе должен быть прозрачным.",
   "Подавай с гречкой и нарезанным огурцом."]},
 {id:"borsch",n:"Борщ с говядиной",m:["l"],t:100,ing:[["beef",100],["beet",100],["cabbage",100],["potato",100],["carrot",50],["onion",30],["tpaste",15],["garlic",5],["lemon",5],["sunoil",5],["sourcream",20],["bread",40]],
  steps:["Положи говядину в кастрюлю, залей 800 мл холодной воды, доведи до кипения и сними пену. Добавь лавровый лист, 3–4 горошины перца и вари на слабом огне 1–1,5 часа до мягкости мяса.",
   "Вынь мясо, нарежь кусочками и верни в бульон. Посоли.",
   "Картофель нарежь кубиком, капусту тонко нашинкуй. Опусти картофель в бульон, через 5 минут — капусту.",
   "Пока варятся овощи, приготовь зажарку: на подсолнечном масле обжарь мелко нарезанный лук и тёртую морковь 4 минуты. Добавь свёклу, натёртую на крупной тёрке, томатную пасту и лимонный сок, туши 7–8 минут. Кислота сохраняет яркий цвет свёклы.",
   "Переложи зажарку в борщ, когда картофель станет мягким. Вари ещё 5 минут на слабом огне, не давая сильно кипеть.",
   "Добавь измельчённый чеснок, выключи огонь и дай настояться под крышкой 15–20 минут.",
   "Подавай со сметаной, зеленью и хлебом."]},
 {id:"bean_tuna_salad",n:"Салат с фасолью, тунцом и овощами",m:["l","d"],t:10,ing:[["beans",150],["tuna",100],["cucumber",100],["tomato",100],["onion",20],["lemon",10],["olive",10],["bread",40]],
  steps:["Слей жидкость с фасоли и промой её. С тунца тоже слей жидкость.",
   "Лук нарежь тонкими полукольцами и залей на 5 минут холодной водой с каплей лимонного сока, чтобы ушла горечь. Красный лук подойдёт ещё лучше.",
   "Огурец и помидор нарежь кубиком.",
   "Смешай оливковое масло, сок четверти лимона, щепотку соли и перца.",
   "Соедини фасоль, тунец, овощи и лук, заправь и аккуратно перемешай, чтобы тунец остался кусочками. Подавай с хлебом."]},
 {id:"tofu_rice",n:"Тофу с рисом и овощами в соевом соусе",m:["l","d"],t:30,ing:[["tofu",200],["rice",70],["vegmix",200],["soy",15],["garlic",3],["sunoil",7]],
  steps:["Поставь вариться рис: 1 к 1,5 с водой, 15 минут на слабом огне под крышкой.",
   "Тофу промокни полотенцем и нарежь кубиком 2 см.",
   "Разогрей подсолнечное масло на сильном огне и обжарь тофу 5–6 минут, переворачивая, до золотистых граней. Переложи на тарелку.",
   "На той же сковороде обжарь замороженную овощную смесь 5–6 минут без разморозки, пока не испарится вода.",
   "Верни тофу, добавь измельчённый чеснок и соевый соус, перемешай и прогрей 1 минуту.",
   "Подавай с рисом, по желанию посыпь кунжутом."]},
 {id:"chicken_potato_oven",n:"Курица с картофелем и кабачком в духовке",m:["l","d"],t:50,ing:[["chicken",150],["potato",250],["zucchini",150],["garlic",5],["olive",10]],
  steps:["Разогрей духовку до 200 °C.",
   "Картофель нарежь дольками, смешай с половиной оливкового масла, солью, паприкой и сушёным чесноком. Запекай на противне с бумагой 15 минут.",
   "Курицу нарежь кусками 3–4 см, кабачок — полукружиями 1,5 см. Смешай с оставшимся маслом, солью, раздавленным чесноком и прованскими травами.",
   "Выложи курицу и кабачок на противень к картофелю в один слой.",
   "Запекай ещё 20–25 минут, перемешав на середине. Курица готова, когда на разрезе нет розового цвета."]},
 {id:"buckwheat_merchant",n:"Гречка по-купечески с курицей",m:["l","d"],t:40,ing:[["buckwheat",70],["thigh",130],["onion",40],["carrot",50],["tpaste",15],["sunoil",8]],
  steps:["Бёдра нарежь кусочками 2 см, лук мелко, морковь натри на крупной тёрке. Гречку промой.",
   "В сотейнике или глубокой сковороде с крышкой разогрей подсолнечное масло и обжарь курицу на среднем огне 5 минут.",
   "Добавь лук и морковь, жарь 4–5 минут до мягкости. Добавь томатную пасту и жарь ещё минуту.",
   "Всыпь гречку, посоли, добавь лавровый лист и залей горячей водой в пропорции 1 к 2 к гречке.",
   "Доведи до кипения, убавь огонь до минимума и томи под крышкой 20 минут, пока гречка не впитает воду.",
   "Выключи огонь и дай постоять 5 минут, затем перемешай."]},
 {id:"pollock_steam",n:"Минтай на пару с овощами и картофелем",m:["d"],t:30,ing:[["pollock",220],["broccoli",150],["carrot",80],["potato",150],["lemon",10],["olive",5]],
  steps:["Картофель очисти, нарежь крупными кусками и отвари в подсоленной воде 15–18 минут до мягкости.",
   "Минтай посоли, поперчи, сбрызни лимонным соком. Морковь нарежь кружочками, брокколи — соцветиями.",
   "Готовь в пароварке или в сите над кипящей водой под крышкой: морковь 10 минут, рыбу и брокколи — последние 8 минут.",
   "Перед подачей сбрызни рыбу и овощи оливковым маслом и лимонным соком."]},
 {id:"chicken_bulgur_salad",n:"Запечённая куриная грудка с булгуром и салатом",m:["d","l"],t:35,ing:[["chicken",150],["bulgur",50],["salad",50],["cucumber",100],["tomato",100],["lemon",10],["olive",10]],
  steps:["Разогрей духовку до 200 °C.",
   "Грудку обсуши, натри солью, паприкой, сушёным чесноком и половиной оливкового масла.",
   "Запекай 20–25 минут, пока сок при проколе не станет прозрачным. Дай мясу отдохнуть 5 минут перед нарезкой, так оно останется сочным.",
   "Булгур залей кипятком 1 к 2, посоли и томи под крышкой на слабом огне 12–15 минут.",
   "Порви листья салата, нарежь огурец и помидор, заправь оставшимся маслом, лимонным соком и солью.",
   "Нарежь грудку ломтиками и подавай с булгуром и салатом."]},
 {id:"omelet_cheese",n:"Омлет с сыром и овощной салат",m:["d","b"],t:15,ing:[["eggs",165],["cheese",20],["butter",5],["salad",50],["tomato",100],["cucumber",100],["olive",5]],
  steps:["Разбей яйца в миску, добавь щепотку соли и 2 ложки воды или молока, взбей вилкой.",
   "Растопи сливочное масло на сковороде на среднем огне и вылей яйца.",
   "Когда края схватятся, через 1–2 минуты, посыпь омлет тёртым сыром, убавь огонь и накрой крышкой на 3–4 минуты.",
   "Пока омлет готовится, нарежь овощи, порви листья салата, посоли и заправь оливковым маслом.",
   "Сложи омлет пополам и подавай с салатом."]},
 {id:"turkey_veg_stew",n:"Индейка с тушёными овощами и гречкой",m:["d","l"],t:35,ing:[["turkey",160],["zucchini",150],["pepper",100],["onion",40],["tomato",100],["garlic",3],["buckwheat",40],["sunoil",7]],
  steps:["Поставь вариться гречку: 1 к 2 с водой, 15 минут на слабом огне под крышкой.",
   "Индейку нарежь кубиком 2 см, лук полукольцами, кабачок и перец — кубиком 1,5 см, помидор мелко.",
   "Обжарь индейку на подсолнечном масле на сильном огне 5 минут до светлой корочки.",
   "Добавь лук и чеснок, через 2 минуты — кабачок и перец. Посоли, поперчи.",
   "Добавь помидор, накрой крышкой и туши на слабом огне 12–15 минут, пока овощи не станут мягкими.",
   "Подавай с гречкой, посыпав зеленью."]},
 {id:"cottage_casserole",n:"Творожная запеканка с яблоком",m:["d","b"],t:45,ing:[["cottage",220],["eggs",55],["oats",20],["apple",100],["honey",10],["yogurt",30]],
  steps:["Разогрей духовку до 180 °C. Форму примерно 15×15 см застели бумагой.",
   "Измельчи хлопья в блендере в муку.",
   "Разомни творог с яйцом, мёдом и щепоткой соли до однородности. Для нежной текстуры пробей блендером.",
   "Добавь овсяную муку и яблоко, натёртое на крупной тёрке и слегка отжатое от сока. Перемешай.",
   "Выложи массу в форму и разровняй.",
   "Запекай 30–35 минут до золотистого верха. Дай остыть 10 минут, иначе запеканка будет разваливаться при нарезке.",
   "Подавай с греческим йогуртом."]},
 {id:"shrimp_rice",n:"Креветки с овощами и рисом",m:["d","l"],t:25,ing:[["shrimp",180],["rice",50],["vegmix",200],["soy",10],["garlic",5],["sunoil",7]],
  steps:["Поставь вариться рис: 1 к 1,5 с водой, 15 минут на слабом огне под крышкой.",
   "Варёно-мороженые креветки разморозь в холодной воде 10 минут и обсуши.",
   "Разогрей подсолнечное масло на сильном огне, обжарь овощную смесь 5–6 минут, пока не испарится вода.",
   "Добавь измельчённый чеснок и креветки, жарь 2–3 минуты, помешивая. Не передерживай, иначе креветки станут резиновыми.",
   "Влей соевый соус, перемешай и сразу сними с огня. Подавай с рисом."]},
 {id:"turkey_meatballs",n:"Тефтели из индейки в томатном соусе",m:["d","l"],t:45,ing:[["turkey_mince",160],["rice",20],["onion",30],["tomato",150],["zucchini",150],["sunoil",5]],
  steps:["Отвари рис до полуготовности, 8–10 минут, и остуди.",
   "Мелко нарежь лук. Половину смешай с фаршем, рисом, солью и перцем. Сформируй мокрыми руками 6–8 тефтелей.",
   "Для соуса обжарь оставшийся лук на подсолнечном масле 3 минуты, добавь кабачок кубиком и готовь ещё 3 минуты.",
   "Добавь помидоры, нарезанные кубиком, или томаты в собственном соку и 100 мл воды, посоли.",
   "Выложи тефтели в соус, накрой крышкой и туши на слабом огне 20–25 минут, один раз аккуратно перевернув.",
   "Подавай, полив соусом и посыпав зеленью."]},
 {id:"salmon_grill",n:"Лосось с овощами-гриль и отварным картофелем",m:["d"],t:30,ing:[["salmon",130],["zucchini",150],["pepper",100],["salad",40],["potato",150],["lemon",10],["olive",7]],
  steps:["Отвари картофель в подсоленной воде 15–20 минут.",
   "Разогрей духовку до 190 °C. Лосось посоли, поперчи, сбрызни лимонным соком и запекай 12–15 минут.",
   "Кабачок нарежь вдоль пластинами 7 мм, перец — широкими полосками. Смешай с оливковым маслом и солью.",

/* ---------- Питание: дневной трекер ----------
   Сверху остаток калорий и БЖУ на сегодня. Пользователь выбирает приём пищи и видит все подходящие
   блюда с граммовками под остаток. «Съел» записывает блюдо, и порции остальных приёмов пересчитываются. */
const FOOD_TAGS={lac:"Без лактозы",glu:"Без глютена",nut:"Без орехов",fish:"Без рыбы и морепродуктов",egg:"Без яиц"};
const BUDGETS={eco:"Экономный",mid:"Средний",free:"Без ограничений"};
const MEAL_NAMES={b:"Завтрак",l:"Обед",d:"Ужин",s:"Перекус"};
const MEAL_PLANS={3:[["b",.3],["l",.4],["d",.3]],4:[["b",.25],["l",.35],["s",.1],["d",.3]],5:[["b",.25],["s",.1],["l",.3],["s",.1],["d",.25]]};
const SHOP_CATS={meat:"Мясо, птица, рыба",dairy:"Молочное и яйца",grain:"Крупы, хлеб, макароны",veg:"Овощи и фрукты",other:"Прочее"};
/* Как меняются порции: сначала гарниры, хлеб, фрукты и жиры (FLEX), потом белковые продукты.
   Яйца и овощи не уменьшаются. */
const FLEX=new Set(["oats","buckwheat","rice","bulgur","pasta","bread","lavash","potato","quinoa","sunoil","olive","butter","tahini","honey","nuts","pbutter","banana","apple","berries","avocado"]);
const FIXED=new Set(["eggs","tomato","cucumber","pepper","carrot","onion","broccoli","zucchini","cabbage","beet","spinach","salad","vegmix","garlic","soy","asparagus","cherry","lemon","tpaste"]);
const RINFO={};
function nutr(list){
  const t={kcal:0,p:0,f:0,c:0};
  list.forEach(([id,g])=>{const x=ING[id]; t.kcal+=x[1]*g/100; t.p+=x[2]*g/100; t.f+=x[3]*g/100; t.c+=x[4]*g/100;});
  return t;
}
RECIPES.forEach(r=>{
  const tags=new Set(); r.ing.forEach(([id])=>ING[id][5].forEach(x=>tags.add(x)));
  RINFO[r.id]=Object.assign(nutr(r.ing),{tags});
});
const RBY=Object.fromEntries(RECIPES.map(r=>[r.id,r]));

/* Режим раздела: locked — нет подписки, setup — нужно пройти опросник, med — питание подбирает врач,
   ed — без цифр (расстройства пищевого поведения), plan — трекер. */
function foodMode(){
  if(!(S.premium&&S.full)) return "locked";
  if(!S.food) return "setup";
  if(S.food.ed) return "ed";
  if(S.food.med||S.full.preg) return "med";
  return "plan";
}
function foodAllowed(r){
  const f=S.food||{}, tags=RINFO[r.id].tags;
  if((f.excl||[]).some(x=>tags.has(x))) return false;
  if(f.veg&&(tags.has("meat")||tags.has("fish"))) return false;
  if(f.budget==="eco"&&(tags.has("exp")||tags.has("lux"))) return false;
  if(f.budget==="mid"&&tags.has("lux")) return false;
  return true;
}
function foodPool(type){
  const dens=r=>RINFO[r.id].p*4/RINFO[r.id].kcal;
  return RECIPES.filter(r=>r.m.includes(type)&&foodAllowed(r)).sort((a,b)=>dens(b)-dens(a));
}
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<12||m100>14)?b:c;};
const rg=g=>{g=Math.max(1,g);return g<30?Math.round(g):Math.round(g/5)*5;};
/* Подгонка блюда под калорийность приёма. short — на сколько ккал блюдо всё равно больше бюджета. */
function calcDish(r,budget){
  let fix=0,flx=0,prot=0;
  r.ing.forEach(([id,g])=>{ const k=ING[id][1]*g/100; if(FLEX.has(id)) flx+=k; else { fix+=k; if(!FIXED.has(id)) prot+=k; } });
  let f=flx>0?(budget-fix)/flx:1; f=Math.min(2.2,Math.max(0.3,f));
  let fp=1, total=fix+flx*f;
  if(total<budget*0.95&&prot>0) fp=Math.min(2.2,1+(budget-total)/prot);   // мало гарнира — добавляем белок
  total=fix+prot*(fp-1)+flx*f;
  let short=0;
  if(total>budget+1&&prot>0){ const need=total-budget, cut=Math.min(need,prot*fp*0.5); fp=fp*(1-cut/(prot*fp)); short=need-cut; }
  else if(total>budget+1) short=total-budget;
  const ing=r.ing.map(([id,g])=>[id,FLEX.has(id)?rg(g*f):FIXED.has(id)?g:rg(g*fp)]);
  return Object.assign(nutr(ing),{ing,short});
}

function spark(vals){
  if(vals.length<2) return "";
  const mn=Math.min(...vals), mx=Math.max(...vals), r=mx-mn||1, W=300, H=60;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(W-10)+5).toFixed(1)},${(H-5-(v-mn)/r*(H-10)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}

/* Желаемый вес: только для целей «похудение» и «набор», не показываем в режиме РПП. */
function targetGoal(height,weight){
  const g=(S.profile||{}).goal; if(g!=="lose"&&g!=="gain") return null;
  if(S.food&&S.food.ed) return null;
  if(g==="lose"&&height&&weight&&weight/Math.pow(height/100,2)<18.5) return null;   // при ИМТ ниже нормы похудение не ведём
  return g;
}
function targetField(d){
  const g=targetGoal(); if(!g) return "";
  return `<div class="grid2"><div class="field"><label>${g==="lose"?"Желаемый вес, кг":"Хочу набрать до, кг"}</label><input inputmode="decimal" data-f="target" value="${esc(d.target??"")}" placeholder="по желанию"></div></div>
  <p class="hint small mt0">По нему покажем примерный срок достижения цели и будем пересчитывать его по питанию и взвешиваниям.</p>`;
}
function targetCheck(d,height,weight){
  const g=targetGoal(height,weight), t=parseFloat(String(d.target||"").replace(",","."));
  if(!g||!t) return {};
  const h2=Math.pow(height/100,2), minW=Math.ceil(18.5*h2);
  if(!(t>=35&&t<=250)) return {err:"Проверь желаемый вес: от 35 до 250 кг."};
  if(g==="lose"){
    if(t>=weight-0.5) return {err:"Для похудения желаемый вес должен быть меньше текущего."};
    if(t<minW) return {err:`При росте ${height} см вес ниже ${minW} кг — это недостаток массы тела. Укажи желаемый вес от ${minW} кг.`};
  } else {
    if(t<=weight+0.5) return {err:"Для набора массы желаемый вес должен быть больше текущего."};
    const maxW=Math.floor(weight*1.2);
    if(t>maxW) return {err:`Поставь промежуточную цель — до ${maxW} кг. Когда дойдёшь, поставим следующую.`};
  }
  return {t:Math.round(t*10)/10,goal:g};
}

async function api(path,body){
  const r=await fetch(API_BASE+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));

function giftActive(){ return !!(S.gift&&S.gift.until&&S.gift.until>=today()); }
const b64u=str=>Uint8Array.from(atob(str.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((str.length+3)%4)),c=>c.charCodeAt(0));
async function checkGift(code){
  const m=String(code||"").trim().replace(/\s+/g,"").match(/^DF-(\d{4,15})-(\d{8})-([A-Za-z0-9_-]{80,90})$/);
  if(!m) return {err:"Код не похож на подарочный. Скопируй его целиком, начиная с DF-."};
  const [,id,ymd,sig]=m, until=`${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}`;
  try{
    const key=await crypto.subtle.importKey("jwk",Object.assign({ext:true},GIFT_PUB),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,b64u(sig),new TextEncoder().encode(`${id}.${ymd}`));
    if(!ok) return {err:"Код недействителен. Проверь, что он скопирован полностью."};
  }catch(e){ return {err:"Не получилось проверить код на этом устройстве. Обнови Telegram и попробуй ещё раз."}; }
  const me=myTgId();
  if(!TEST_MODE&&me!==id) return {err:me?"Этот код выдан другому человеку. Попроси код для своего ID.":"Открой DuoFit в Telegram, чтобы активировать код."};
  if(until<today()) return {err:"Срок действия этого кода уже закончился."};
  return {until};
}
const fmtLong=ymd=>{ const [y,m,d]=ymd.split("-"); return `${+d} ${MONTHS_G[+m-1]}${+y!==new Date().getFullYear()?" "+y:""}`; };
async function activateGift(){
  const inp=$("#giftCode"), out=$("#giftMsg"); if(!inp) return;
  out.textContent="Проверяем…"; out.style.color="";
  const r=await checkGift(inp.value);
  if(r.err){ out.textContent=r.err; out.style.color="var(--warn)"; return; }
  const paid=S.premium&&S.premSrc==="pay";
  S.gift={until:r.until};
  if(!paid){ S.premium=true; S.premSrc="gift"; S.premUntil=r.until+"T23:59:00"; }
  save(); haptic("success");
  if(paid){ render(); popup(`Подарочный код активирован до ${fmtLong(r.until)}. Твоя оплаченная подписка продолжает действовать.`); return; }
  afterPremium(); if(S.full) popup(`Подарок активирован! Подписка DuoFit действует до ${fmtLong(r.until)} 🎁`);
}

/* ---------- Уведомления от тренера ----------
   Настройки хранятся в приложении, а на сервер уходит сводка: дни и время напоминаний, часовой пояс, пол (кто пишет — Макс или Ева),

}

/* ---------- Анимации техники: объёмная фигура ----------
   Поза задаётся в 3D (x — вперёд, y — вниз, z — влево от человека), поэтому одну и ту же позу можно показать
   сбоку, спереди, сзади или сверху. Колени и локти считаются обратной кинематикой с направлением сгиба.
   Тело — капсулы и «кольца» корпуса, мышцы — пятна на поверхности, обрезанные по силуэту сегмента.
   Основные работающие мышцы — коралловые, вспомогательные — светлее. */
const v3={

 l:p=>Math.hypot(p[0],p[1],p[2]), n:p=>{const l=Math.hypot(p[0],p[1],p[2])||1;return [p[0]/l,p[1]/l,p[2]/l];},
 lp:(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t]

/* сумма: base + v1*k1 + v2*k2 ... */
const vs=(...r)=>vc([0,0,0],...r);
const vc=(b,...r)=>{let o=b.slice();for(let i=0;i<r.length;i+=2)o=v3.a(o,v3.m(r[i],r[i+1]));return o;};
const orth=(v,ax)=>v3.n(v3.s(v,v3.m(ax,v3.d(v,ax))));
const lerp=(a,b,t)=>a+(b-a)*t;
const DG=Math.PI/180;
/* направление в плоскости x-y по углу (как на экране сбоку: -90 — вверх, 0 — вперёд, 90 — вниз) */
const dA=(a,z)=>{const c=Math.cos(a*DG),s=Math.sin(a*DG),k=z?Math.cos(z*DG):1;return [c*k,s*k,z?Math.sin(z*DG):0];};

  return [v[0]*c+kv[0]*s+k[0]*kd*(1-c), v[1]*c+kv[1]*s+k[1]*kd*(1-c), v[2]*c+kv[2]*s+k[2]*kd*(1-c)]; }
const ease=t=>.5-.5*Math.cos(t*Math.PI);           // плавный 0→1
const seg01=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
function ik3(R,T,l1,l2,pole){
  let d=v3.s(T,R), dist=v3.l(d); const u=v3.n(d); dist=Math.max(Math.abs(l1-l2)+.01,Math.min(l1+l2-.01,dist));
  const a=(l1*l1+dist*dist-l2*l2)/(2*dist), h=Math.sqrt(Math.max(0,l1*l1-a*a)), p=orth(pole,u);
  const J=vc(R,u,a,p,h), E=v3.a(J,v3.m(v3.n(v3.s(vc(R,u,dist),J)),l2)); return [J,E,p];
}
const AL={low:21,up:29,neck:7,head:9.5,thigh:34,shin:33,uarm:26,farm:24,foot:13};
const FIG={

 f:{hipJ:9,shJ:13.8,ring:[[13,7,10.5],[9,6.5,6],[12.5,10.5,6.5],[13.8,6,6]],thigh:[15.5,9.5],shin:[10,6],uarm:[8,6.3],farm:[6.5,4.8],bun:1}

let FIG_SEX="m";
/* Каркас корпуса: P — центр таза, U — «вверх» по нижней части корпуса, L — влево, U2 — вверх по верхней части (наклон грудного отдела). */
function frame(P,U,L,U2,nod,tw,roll){
  U=v3.n(U); L=orth(L||[0,0,1],U); const F=v3.x(L,U);

  if(roll) Uh=rot(Uh,F2,roll);                         // наклон головы к плечу
  return {P,U,L,F,U2,L2,F2,W,S,Uh,
    hip:i=>vc(P,L,i?-D.hipJ:D.hipJ,U,-2),
    sh:i=>vc(S,L2,i?-D.shJ:D.shJ,U2,-2.5),
    head:vc(S,Uh,AL.neck+AL.head+1),
    at:(f,u,l)=>vc(P,F,f,U,u,L,l),        // точка в системе таза
    up:(f,u,l)=>vc(W,F2,f,U2,u,L2,l)};    // точка в системе груди (от талии)

const CAM={

 back:{p:q=>[-q[2],q[1]],d:q=>-q[0],dir:[-1,0,0],floor:1},

  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }

  return lo.slice(0,-1).concat(hi.slice(0,-1));

const capIn=c=>`<polygon points="${pts2(c.poly)}"/><circle cx="${f1(c.a[0])}" cy="${f1(c.a[1])}" r="${f1(c.ra)}"/><circle cx="${f1(c.b[0])}" cy="${f1(c.b[1])}" r="${f1(c.rb)}"/>`;
const capSvg=(c,fill)=>`<g fill="${fill}">${capIn(c)}</g>`;
/* Мышцы: на конечностях — {seg, at, dir: ant|post|med|lat|all, len, wid}; на корпусе — точки в системе таза/груди */
const LIMB_M={
 thigh:[["quads","ant",.52,.46,.95],["hams","post",.5,.44,.9],["adductors","med",.3,.32,.7],["abductors","lat",.2,.22,.6]],
 shin:[["calves","post",.3,.32,.95],["tibialis","ant",.35,.28,.5]],
 uarm:[["biceps","ant",.56,.36,.85],["triceps","post",.5,.4,.85],["delts","top",.1,.2,1.15]],
 farm:[["forearms","ant",.3,.32,.8]]
};
const MCOL={on:"var(--mOn)",on2:"var(--mOn2)",off:"var(--mOff)"};
function render3d(id,t,cam){
  const A=EXANIM[id], C=CAM[cam||A.views[0]], p=A.pose(t), f=p.f, D=FIG[FIG_SEX];
  const prim=new Set(A.m[0]||[]), sec=new Set(A.m[1]||[]);
  const mc=k=>prim.has(k)?MCOL.on:sec.has(k)?MCOL.on2:null;
  const P2=C.p, DP=C.d, cd=C.dir, items=[]; let cid=0; const RID="r"+((render3d.n=(render3d.n||0)+1)%100000)+"_";
  const cDepth=DP(v3.lp(f.P,f.S,.5));
  const far=(dp)=>dp<cDepth-4;
  const bodyCol=fa=>fa?"var(--bodyD)":"var(--bodyC)";
  const offCol=fa=>fa?"var(--mOffD)":"var(--mOff)";
  /* пятно-эллипс: центр c, оси t1*r1 и t2*r2, нормаль n — на ребре пятно «раздувается» по нормали, чтобы остаться видимым */
  const patch=(c,t1,r1,t2,r2,n,col,clip)=>{ 
    const v=v3.d(n,cd); if(v<-.25) return "";
    const k=1.1*(1-Math.min(1,Math.abs(v)));
    const c2=P2(c), pv=q=>{ const z=P2(v3.a(c,q)); return [z[0]-c2[0],z[1]-c2[1]]; };
    let A1=pv(v3.m(t1,r1)), A2=pv(v3.m(t2,r2)); const An=pv(v3.m(n,Math.min(r1,r2)*k));
    /* ось, которая «смотрит» в камеру, схлопывается — вместо неё пятно раздувается по нормали */
    if(Math.hypot(A1[0],A1[1])<Math.hypot(A2[0],A2[1])) A1=[A1[0]+An[0],A1[1]+An[1]]; else A2=[A2[0]+An[0],A2[1]+An[1]];
    if(Math.abs(A1[0]*A2[1]-A1[1]*A2[0])<1.2) return "";
    return `<g clip-path="url(#${RID}${clip})"><circle r="1" fill="${col}" transform="matrix(${f1(A1[0])} ${f1(A1[1])} ${f1(A2[0])} ${f1(A2[1])} ${f1(c2[0])} ${f1(c2[1])})"/></g>`;
  };
  const defs=[];
  const limb=(a,b,ra,rb,name,ant,med,fa,extra)=>{
    const c=capPoly(P2(a),P2(b),ra,rb), id=cid++; defs.push(`<clipPath id="${RID}${id}">${capIn(c)}</clipPath>`);
    let s=capSvg(c,bodyCol(fa));
    const u=v3.n(v3.s(b,a)), L=v3.l(v3.s(b,a)), an=orth(ant,u), md=orth(med,u);
    const ps=[];
    (LIMB_M[name]||[]).forEach(([k,dir,at,len,wid])=>{
      const n=dir==="top"?orth(cd,u):dir==="ant"?an:dir==="post"?v3.m(an,-1):dir==="med"?md:v3.m(md,-1);
      const r=lerp(ra,rb,at), ctr=vc(v3.lp(a,b,at),n,r*.5), tg=v3.x(u,n);
      const col=(k==="delts"?mc("delts")||mc("rdelts"):mc(k))||((k==="adductors"||k==="abductors"||k==="tibialis"||k==="forearms")?null:offCol(fa));
      if(!col) return;
      ps.push([v3.d(n,cd)+(prim.has(k)?.3:sec.has(k)?.15:0),patch(ctr,u,L*len,tg,r*wid,n,col,id)]);
    });
    ps.sort((x,y)=>x[0]-y[0]).forEach(x=>s+=x[1]);
    items.push({d:DP(v3.lp(a,b,.5))+(extra||0),s});
  };
  /* ноги */
  const legPts=[];
  (p.legs||[]).forEach((lg,i)=>{
    const H=f.hip(i), pole=lg.pole||f.F, [K,An,kp]=ik3(H,lg.A,AL.thigh,AL.shin,pole);
    let fd=lg.toe; if(!fd){ const h=[f.F[0],0,f.F[2]]; fd=v3.l(h)>.5?v3.n(h):f.F; } fd=v3.n(fd);
    const heel=vc(An,fd,-3), toe=vc(An,fd,AL.foot), md=v3.m(f.L,i?1:-1);
    const fa=far(DP(v3.lp(H,K,.5)));
    limb(H,K,D.thigh[0]/2,D.thigh[1]/2,"thigh",kp,md,fa,.01);
    limb(K,An,D.shin[0]/2,D.shin[1]/2,"shin",kp,md,fa);
    const fc=capPoly(P2(heel),P2(toe),3.4,2.4); items.push({d:DP(v3.lp(heel,toe,.5)),s:capSvg(fc,bodyCol(fa))});
    legPts.push(H,K,An,toe,heel);
  });
  /* руки */
  const hands=[];
  (p.arms||[]).forEach((ar,i)=>{
    const Sh=f.sh(i), pole=ar.pole||v3.m(f.F2,-1), [E,Hd,ep]=ik3(Sh,ar.H,AL.uarm,AL.farm,pole);
    const fa=far(DP(v3.lp(Sh,E,.5))), md=v3.m(f.L2,i?1:-1);
    limb(Sh,E,D.uarm[0]/2,D.uarm[1]/2,"uarm",v3.m(ep,-1),md,fa,.02);
    limb(E,Hd,D.farm[0]/2,D.farm[1]/2,"farm",v3.m(ep,-1),md,fa,.02);
    const hp=P2(vc(Hd,v3.n(v3.s(Hd,E)),2));
    items.push({d:DP(Hd)+.03,s:`<circle cx="${f1(hp[0])}" cy="${f1(hp[1])}" r="3.9" fill="${bodyCol(fa)}"/>`});
    /* дельта — круглая «шапка» плеча */
    const dc=mc("delts")||mc("rdelts")||offCol(fa), sp=P2(vc(Sh,v3.n(v3.s(E,Sh)),2.5));
    items.push({d:DP(Sh)+.04,s:`<circle cx="${f1(sp[0])}" cy="${f1(sp[1])}" r="${f1(D.uarm[0]/2+.9)}" fill="${bodyCol(fa)}"/><circle cx="${f1(sp[0])}" cy="${f1(sp[1])}" r="${f1(D.uarm[0]/2-.2)}" fill="${dc}"/>`});
    hands.push({H:Hd,E,i,fa});
  });
  /* корпус: два «стакана» колец */
  const ring=(c,U,L,F,[lat,fr,bk],n)=>{ const o=[]; for(let k=0;k<n;k++){ const a=k/n*2*Math.PI, cs=Math.cos(a), sn=Math.sin(a); o.push(P2(vc(c,L,lat*cs,F,(sn>0?fr:bk)*sn))); } return o; };
  const R=D.ring;
  const lowPts=[...ring(vc(f.P,f.U,-5),f.U,f.L,f.F,R[0],16),...ring(f.P,f.U,f.L,f.F,R[0],16),...ring(f.W,f.U,f.L,f.F,R[1],16)];
  const upPts=[...ring(f.W,f.U2,f.L2,f.F2,R[1],16),...ring(vc(f.W,f.U2,15),f.U2,f.L2,f.F2,R[2],16),...ring(vc(f.W,f.U2,AL.up-3),f.U2,f.L2,f.F2,R[3],16),...ring(vc(f.W,f.U2,AL.up+1),f.U2,f.L2,f.F2,[R[3][0]*.55,4,4],12)];
  const tor=(pts,c)=>{ const h=hull(pts), id=cid++; defs.push(`<clipPath id="${RID}${id}"><polygon points="${pts2(h)}"/></clipPath>`); return {h,id,s:`<polygon points="${pts2(h)}" fill="var(--bodyC)" stroke="var(--bodyC)" stroke-width="3" stroke-linejoin="round"/>`}; };
  const lo=tor(lowPts), up=tor(upPts);
  const T=(id,c,t1,r1,t2,r2,n,k)=>{ const col=mc(k)||(k==="obliques"||k==="gmed"||k==="traps"||k==="lowback"?null:"var(--mOff)"); return col?patch(c,t1,r1,t2,r2,n,col,id):""; };
  let sLo=lo.s, sUp=up.s;
  [1,-1].forEach(sd=>{
    // ягодицы, средняя ягодичная, поясница, косые
    sLo+=T(lo.id,f.at(-1,4,sd*(R[0][0]-1)),f.U,5,f.F,4.5,v3.m(f.L,sd),"gmed");
    sLo+=T(lo.id,f.at(-R[1][2]+.5,AL.low*.65,sd*3.2),f.U,7.5,f.L,2.6,v3.m(f.F,-1),"lowback");
    sLo+=T(lo.id,f.at(2.5,AL.low*.62,sd*(R[1][0]-1.5)),f.U,7,f.F,3.6,v3.n(vc(v3.m(f.L,sd),f.F,.6)),"obliques");
    sLo+=T(lo.id,f.at(R[1][1]-.5,AL.low*.62,sd*2.9),f.U,7.5,f.L,2.6,f.F,"abs");
    // грудь, верх пресса, широчайшие, трапеции
    sUp+=T(up.id,f.up(R[2][1]-1.5,AL.up*.66,sd*6.8),f.L2,7.6,f.U2,6.4,v3.n(vc(f.F2,f.L2,sd*.15)),"chest");
    sUp+=T(up.id,f.up(R[1][1]+1,4.5,sd*2.9),f.U2,6,f.L2,2.6,f.F2,"abs");
    sUp+=T(up.id,f.up(-R[2][2]+1,AL.up*.45,sd*8),f.U2,9.5,f.L2,4.6,v3.n(vc(v3.m(f.F2,-1),f.L2,sd*.45)),"back");
    sUp+=T(up.id,f.up(-R[3][2]+1.5,AL.up-2,sd*5),f.L2,5,f.U2,3.4,v3.n(vc(v3.m(f.F2,-1),f.U2,.4)),"traps");
    sUp+=T(up.id,f.up(-1,AL.up*.35,sd*(R[2][0]-1)),f.U2,6,f.F2,3.6,v3.n(vc(v3.m(f.L2,sd),f.F2,.3)),"obliques");
  });
  items.push({d:DP(vc(f.P,f.U,AL.low*.5)),s:sLo});
  /* ягодицы рисуем поверх бёдер: они накрывают верх ноги сзади */
  let sG=""; const gc=f.at(-R[0][2]+2,-2,0);
  [1,-1].forEach(sd=>{ sG+=T(lo.id,f.at(-R[0][2]+2.5,-2,sd*5.8),f.U,8.5,f.L,7,v3.n(vc(v3.m(f.F,-1),f.L,sd*.3)),"glutes"); });
  if(sG) items.push({d:DP(gc)+14,s:sG});
  items.push({d:DP(vc(f.W,f.U2,AL.up*.5))+.001,s:sUp});
  /* шея и голова */
  const nb=vc(f.S,f.U2,-2), nt=vc(f.S,f.Uh,AL.neck+2), hc=f.head;
  items.push({d:DP(nt)-.5,s:capSvg(capPoly(P2(nb),P2(nt),5,4.4),"var(--bodyC)")});
  const hp=P2(hc); let head=`<circle cx="${f1(hp[0])}" cy="${f1(hp[1])}" r="${AL.head}" fill="var(--bodyC)"/>`;
  if(D.bun){ const bc=vc(hc,f.Uh,5,orth(f.F2,f.Uh),-7.5), bp=P2(bc);
    items.push({d:DP(bc),s:`<circle cx="${f1(bp[0])}" cy="${f1(bp[1])}" r="4.6" fill="var(--hair)"/>`}); }
  items.push({d:DP(hc),s:head});
  /* снаряды */
  (p.props||[]).forEach(pr=>items.push(...propItems(pr,P2,DP,cd)));
  (p.hold||[]).forEach(hd=>{ const h=hands[hd.i||0]; if(h) items.push(...propItems(Object.assign({},hd,{at:hd.at||h.H}),P2,DP,cd,h.fa)); });
  items.sort((a,b)=>a.d-b.d);
  const floor=C.floor&&!A.nofloor?`<line x1="-400" y1="140.5" x2="600" y2="140.5" stroke="var(--line)" stroke-width="3"/>`:"";
  return `<defs>${defs.join("")}</defs>${floor}${items.map(i=>i.s).join("")}`;
}
/* Снаряды. kind: db (гантель), bb (штанга), box (скамья/опора), bar (перекладина/рукоять), band (резинка), cable (трос), disc */
function propItems(pr,P2,DP,cd,fa){
  /* явная глубина d подобрана под вид сбоку; для других ракурсов глубина считается по геометрии */
  const fixD=pr.d!=null&&cd[2]!==0;
  const o=[], E=fa?"var(--equipD)":"var(--equip)";
  const disc=(c,ax,r,th,col)=>{ ax=v3.n(ax); const e1=orth(Math.abs(ax[1])<.9?[0,1,0]:[1,0,0],ax), e2=v3.x(ax,e1);
    const out=[]; [-th/2,th/2].forEach(s=>{ const cc=vc(c,ax,s), c2=P2(cc), a=P2(vc(cc,e1,r)), b=P2(vc(cc,e2,r));
      out.push(`<circle r="1" fill="${col}" transform="matrix(${f1(a[0]-c2[0])} ${f1(a[1]-c2[1])} ${f1(b[0]-c2[0])} ${f1(b[1]-c2[1])} ${f1(c2[0])} ${f1(c2[1])})"/>`); });
    // боковина цилиндра
    const pts=[]; for(let k=0;k<16;k++){ const an=k/16*2*Math.PI; [-th/2,th/2].forEach(s=>pts.push(P2(vc(c,ax,s,e1,r*Math.cos(an),e2,r*Math.sin(an))))); }
    return `<polygon points="${pts2(hull(pts))}" fill="${col}"/>`+out.join(""); };
  const rod=(a,b,w,col)=>capSvg(capPoly(P2(a),P2(b),w/2,w/2),col);
  if(pr.k==="db"){ const ax=v3.n(pr.ax||[0,0,1]), c=pr.at, L=pr.len||15, r=pr.r||6.5;
    o.push({d:DP(c)+.06,s:rod(vc(c,ax,-L/2),vc(c,ax,L/2),3,E)+disc(vc(c,ax,-L/2-2),ax,r,5,E)+disc(vc(c,ax,L/2+2),ax,r,5,E)}); }
  if(pr.k==="kb"){ const c=pr.at; o.push({d:DP(c)+.06,s:disc(vc(c,[0,1,0],7),[0,0,1],8,9,E)+rod(vc(c,[0,0,1],-5),vc(c,[0,0,1],5),3,E)}); }
  if(pr.k==="bb"){ const ax=v3.n(pr.ax||[0,0,1]), c=pr.at, half=pr.half||58, r=pr.r||19;
    o.push({d:DP(c)+.06,s:rod(vc(c,ax,-half),vc(c,ax,half),3,E)});
    const face=Math.abs(v3.d(ax,cd))>.7;
    [-1,1].forEach(sd=>{ const pc=vc(c,ax,sd*(half-10)); o.push({d:DP(pc)+.07,s:face?`<g opacity=".55">${disc(pc,ax,r,7,E)}</g>`:disc(pc,ax,r,7,E)}); }); }
  if(pr.k==="box"){ const [a,b]=pr.box, P=[]; for(const x of [a[0],b[0]]) for(const y of [a[1],b[1]]) for(const z of [a[2],b[2]]) P.push(P2([x,y,z]));
    const c=[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];
    const corners=[]; for(const x of [a[0],b[0]]) for(const y of [a[1],b[1]]) for(const z of [a[2],b[2]]) corners.push(DP([x,y,z]));
    o.push({d:(fixD?pr.d:Math.min(...corners)+2),s:`<polygon points="${pts2(hull(P))}" fill="${pr.col||"var(--hint)"}" fill-opacity="${pr.op||.42}" stroke="${pr.col||"var(--hint)"}" stroke-opacity="${pr.op||.42}" stroke-width="2" stroke-linejoin="round"/>`}); }
  if(pr.k==="rod"){ o.push({d:(fixD?pr.d:DP(v3.lp(pr.a,pr.b,.5))),s:rod(pr.a,pr.b,pr.w||3.5,pr.col||E)}); }
  if(pr.k==="band"||pr.k==="cable"){ const P=pr.pts.map(P2);
    o.push({d:(fixD?pr.d:DP(pr.pts[pr.pts.length-1])-.01),s:`<polyline points="${pts2(P)}" fill="none" stroke="${pr.k==="band"?"var(--band)":"var(--hint)"}" stroke-width="${pr.k==="band"?3:1.6}" stroke-linecap="round" stroke-linejoin="round"/>`}); }
  if(pr.k==="bottle"){ const ax=v3.n(pr.ax||[1,0,0]), c=pr.at;
    o.push({d:DP(c)+.06,s:rod(vc(c,ax,-9),vc(c,ax,9),8,"var(--water)")+rod(vc(c,ax,9),vc(c,ax,12),4,"var(--water)")}); }
  if(pr.k==="disc"){ o.push({d:DP(pr.at),s:disc(pr.at,pr.ax,pr.r,pr.th||4,pr.col||E)}); }
  return o;
}
/* Кадр под упражнение и камеру: границы по всему циклу, поля, пропорции 240×168, пол — внизу. */
const exBoxCache={};
function exBox(id,cam){
  const key=id+"|"+cam+"|"+FIG_SEX; if(exBoxCache[key]) return exBoxCache[key];
  const A=EXANIM[id], C=CAM[cam]; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(let k=0;k<=12;k++){ const svg=render3d(id,k/12,cam).replace(/<defs>.*?<\/defs>/,"").replace(/<line[^>]*\/>/,"");
    // грубо: берём все числа из points/cx/cy/matrix-центров
    for(const m of svg.matchAll(/points="([^"]+)"/g)) m[1].split(" ").forEach(q=>{const [x,y]=q.split(",").map(Number);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
    for(const m of svg.matchAll(/cx="([-\d.]+)" cy="([-\d.]+)" r="([\d.]+)"/g)){const x=+m[1],y=+m[2],r=+m[3];x0=Math.min(x0,x-r);x1=Math.max(x1,x+r);y0=Math.min(y0,y-r);y1=Math.max(y1,y+r);} }
  const pad=8; x0-=pad; x1+=pad; y0-=pad;
  if(C.floor&&!A.nofloor) y1=Math.max(y1,141)+5; else y1+=pad;
  let w=x1-x0, h=y1-y0; const R=240/168;
  if(w/h<R){ const nw=h*R; x0-=(nw-w)/2; w=nw; } else { const nh=w/R; y0-=(nh-h)*(C.floor&&!A.nofloor?1:.5); h=nh; }
  return exBoxCache[key]=`${f1(x0)} ${f1(y0)} ${f1(w)} ${f1(h)}`;
}

/* Ключевые кадры: keys=[[t,{поле:число|массив}],...] → плавная интерполяция между соседними */
function kfi(keys,t){
  let i=0; while(i<keys.length-2&&t>keys[i+1][0]) i++;
  const [ta,a]=keys[i], [tb,b]=keys[i+1], u=ease(Math.max(0,Math.min(1,(t-ta)/((tb-ta)||1)))), o={};
  for(const k in a){ const x=a[k], y=b[k]; o[k]=Array.isArray(x)?x.map((v,j)=>lerp(v,y[j],u)):lerp(x,y,u); }
  return o;
}

/* ---------- Позы упражнений ----------
   Каждая запись: P — период (с), views — камеры (первая по умолчанию), m — [основные, вспомогательные] мышцы,
   cyc — фаза идёт по кругу (ходьба, вело), иначе 0→1→0. pose(t) возвращает каркас f, ноги, руки и снаряды. */
const Y0=135;
const UPV=[0,-1,0], DN=[0,1,0], FW=[1,0,0], BK=[-1,0,0], LZ=[0,0,1];
const toeOut=(i,a)=>[Math.cos((a||10)*DG),0,(i?-1:1)*Math.sin((a||10)*DG)];
const kneeOut=(i,k)=>v3.n([1,0,(i?-1:1)*(k||.25)]);
const lp3=v3.lp;
const sd=i=>i?-1:1;
const legsStand=(ax,w,o)=>[0,1].map(i=>({A:[ax,Y0,sd(i)*w],toe:toeOut(i,o&&o.toe),pole:kneeOut(i,o&&o.k)}));
const mk=(P,pitch,o)=>{o=o||{}; return frame(P,dA(pitch),o.L||LZ,o.up2!=null?dA(o.up2):(o.U2||null),o.nod,o.tw,o.roll);};
const both=fn=>[0,1].map(fn);
const hang=(f,i,fw)=>({H:vc(f.sh(i),DN,48,FW,fw||2),pole:BK});
const benchP=(x0,x1,y,w,d)=>[{k:"box",box:[[x0,y,-(w||13)],[x1,y+5,(w||13)]],d:d!=null?d:-40},{k:"box",box:[[x0+3,y+5,-(w||13)+3],[x0+7,140,(w||13)-3]],d:d!=null?d:-40},{k:"box",box:[[x1-7,y+5,-(w||13)+3],[x1-3,140,(w||13)-3]],d:d!=null?d:-40}];
const handsOnHips=(f)=>both(i=>({H:f.at(1,9,sd(i)*13),pole:v3.n(vc(v3.m(f.L,sd(i)),f.F,-.4))}));
const dbHold=(i,ax)=>({k:"db",i,ax:ax||LZ});

const EXANIM={
/* ===== Приседания ===== */

/* Интерфейс анимации: переключатель ракурса, легенда, пауза по нажатию. Фигура — по полу из анкеты. */
const VIEW_LBL={side:"Сбоку",front:"Спереди",back:"Сзади",top:"Сверху"};
let exAnimRun=null; const exViewSel={};
function figSex(){ const x=(S.full&&S.full.sex)||(S.profile&&S.profile.sex); return x==="f"?"f":"m"; }
function exCam(id){ const A=EXANIM[id]; return A.views.includes(exViewSel[id])?exViewSel[id]:A.views[0]; }
function exAnimHtml(id){
  const A=EXANIM[id]; if(!A) return "";
  FIG_SEX=figSex(); const cam=exCam(id), sw=c=>`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};vertical-align:-1px;margin-right:4px"></span>`;
  const tabs=A.views.length>1?`<div class="seg" style="grid-template-columns:repeat(${A.views.length},1fr);margin:0 0 6px">${A.views.map(v=>`<button data-a="exView" data-v="${v}" aria-pressed="${v===cam}">${VIEW_LBL[v]}</button>`).join("")}</div>`:"";
  return `<div class="card" style="padding:8px 8px 6px">${tabs}<svg id="exAnim" data-id="${id}" viewBox="${exBox(id,cam)}" style="width:100%;height:auto;display:block;cursor:pointer" role="img" aria-label="Анимация техники: ${VIEW_LBL[cam].toLowerCase()}">${render3d(id,0,cam)}</svg>
   <div class="row between small hint" style="padding:2px 6px 0;flex-wrap:wrap;gap:4px 10px"><span>Нажми, чтобы поставить на паузу</span><span>${sw("var(--mOn)")}основные${A.m[1]&&A.m[1].length?` &nbsp;${sw("var(--mOn2)")}помогают`:""}</span></div></div>`;
}
A.exView=(v)=>{ const el=document.getElementById("exAnim"); if(!el) return; const id=el.dataset.id; exViewSel[id]=v;
  el.setAttribute("viewBox",exBox(id,v)); el.setAttribute("aria-label","Анимация техники: "+VIEW_LBL[v].toLowerCase());
  document.querySelectorAll('[data-a="exView"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  if(exAnimRun) exAnimRun.cam=v; else el.innerHTML=render3d(id,EXANIM[id].cyc?0:1,v); haptic("light"); };
function startExAnim(){
  const el=document.getElementById("exAnim"); if(!el) return;
  const id=el.dataset.id, A=EXANIM[id], reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  FIG_SEX=figSex();
  if(reduce){ exAnimRun=null; el.innerHTML=render3d(id,A.cyc?0:1,exCam(id)); return; }
  const run={paused:false,t0:performance.now(),off:0,cam:exCam(id)}; exAnimRun=run;
  el.onclick=()=>{ run.paused=!run.paused; if(!run.paused) run.t0=performance.now()-run.off; };
  let last=0;
  (function step(now){
    if(exAnimRun!==run||!document.body.contains(el)) return;
    if(!run.paused&&now-last>33){ last=now; run.off=now-run.t0; const ph=(run.off/1000)/A.P;
      el.innerHTML=render3d(id,A.cyc?ph%1:.5-.5*Math.cos(ph*2*Math.PI),run.cam); }
    requestAnimationFrame(step);
  })(performance.now());
}

/* ---------- Таймер отдыха ---------- */
function startTimer(sec){
  stopTimer(); timerEnd=Date.now()+sec*1000; $("#timer").hidden=false; tick();
  timerInt=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.round((timerEnd-Date.now())/1000));
  $("#tleft").textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  if(left<=0){ stopTimer(); haptic("success"); }
}
function stopTimer(){ clearInterval(timerInt); timerInt=null; $("#timer").hidden=true; }

/* ---------- Утилиты Telegram ---------- */
let lastScroll=0;
function restoreScroll(){ window.scrollTo(0,lastScroll); }
function haptic(t){ try{ if(!inTg) return; t==="light"?tg.HapticFeedback.impactOccurred("light"):tg.HapticFeedback.notificationOccurred(t);}catch(e){} }
/* Telegram показывает в системном окне не больше 256 символов, длинные сообщения выводим своим окном. */
function popup(m){
  if(inTg&&tg.showAlert&&m.length<=250){ try{ tg.showAlert(m); return; }catch(e){} }
  if(!inTg&&typeof TEST_MODE!=="undefined"&&!TEST_MODE&&m.length<=250){ alert(m); return; }
  const old=document.getElementById("dfModal"); if(old) old.remove();

/* ---------- Тема ----------
   Из Telegram берём только светлую или тёмную схему, цвета у DuoFit фирменные.
   Шапку и фон Telegram красим в цвет приложения, чтобы не было полос другого цвета. */
function applyTheme(){
  const r=document.documentElement;
  r.setAttribute("data-theme",tg.colorScheme==="light"?"light":"dark");
  const bg=getComputedStyle(r).getPropertyValue("--bg").trim();
  try{ tg.setHeaderColor(bg); }catch(e){} try{ tg.setBackgroundColor(bg); }catch(e){} try{ tg.setBottomBarColor&&tg.setBottomBarColor(getComputedStyle(r).getPropertyValue("--card").trim()); }catch(e){}
}
/* ---------- Значок на экране «Домой» ----------
   Telegram с Bot API 8.0 умеет ставить ярлык мини-приложения на экран телефона: addToHomeScreen()
   и checkHomeScreenStatus() → added / missed / unknown / unsupported. На компьютере и в веб-версии не работает,
   на iPhone последний шаг делается в Safari («Поделиться» → «На экран „Домой“»). */
let homeSt=null;
function homeCheck(){
  if(!inTg){ homeSt="notg"; return; }
  if(!(tg.isVersionAtLeast&&tg.isVersionAtLeast("8.0"))||typeof tg.addToHomeScreen!=="function"){ homeSt="old"; return; }
  homeSt="unknown";
  try{ tg.checkHomeScreenStatus(st=>{ homeSt=st||"unknown"; if(view==="profile") render(); }); }catch(e){}
}
function homeHtml(){
  const plat=inTg?String(tg.platform||""):"", desk=/tdesktop|macos|web/.test(plat), ios=plat==="ios";
  const box=(ico,title,body,btn)=>`<div class="card"><div class="row"><span style="font-size:22px">${ico}</span><div class="grow"><b>${title}</b><div class="hint small">${body}</div></div></div>${btn||""}</div>`;
  if(homeSt==="added") return box("✅","DuoFit на экране «Домой»","Открывай приложение одним нажатием, без поиска чата.");
  if(!inTg&&!TEST_MODE) return "";
  if(homeSt==="unsupported"||desk) return box("📱","Значок на экране «Домой»","Добавить значок можно только в Telegram на телефоне — Android или iPhone. На компьютере и в веб-версии Telegram такой функции нет.");
  if(homeSt==="old") return box("📱","Значок на экране «Домой»","Обнови Telegram до последней версии: в старых версиях этой функции нет. Потом открой DuoFit снова.");
  return box("📱","Добавить DuoFit на экран «Домой»",ios?"Откроется Safari: нажми «Поделиться» внизу, затем «На экран „Домой“» и «Добавить».":"Значок появится рядом с другими приложениями — тренировка в одно касание.",
    `<button class="btn sm" data-a="homeAdd" style="margin-top:10px">Добавить значок</button>`);
}
A.homeAdd=()=>{
  track("home_add_click");
  if(!inTg||typeof tg.addToHomeScreen!=="function"){ popup("Открой DuoFit в Telegram на телефоне — там появится кнопка добавления значка."); return; }
  try{ tg.addToHomeScreen(); }catch(e){ popup("Не получилось открыть добавление. Обнови Telegram и попробуй ещё раз или нажми «⋯» в правом верхнем углу → «Добавить на экран „Домой“»."); }
};

/* ---------- Старт ---------- */
(function init(){
  if(inTg){
    tg.ready(); tg.expand();
    applyTheme(); try{ tg.onEvent("themeChanged",applyTheme); }catch(e){}
    try{ tg.onEvent("homeScreenAdded",()=>{ homeSt="added"; track("home_added"); haptic("success"); if(view==="profile") render(); });
      tg.onEvent("homeScreenChecked",e=>{ if(e&&e.status){ homeSt=e.status; if(view==="profile") render(); } }); }catch(e){}
    homeCheck();
    tg.BackButton.onClick(goBack);
    cloudRestore();
    syncStatus();
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) syncStatus(); });
    setInterval(()=>{ if(view==="paying"&&!document.hidden) syncStatus(); },5000);
  }
  if(S.profile&&!S.profile.sex&&S.full) S.profile.sex=S.full.sex;
  document.documentElement.setAttribute("data-anim",S.noAnim?"off":"on");
  if(S.profile&&!S.start) S.start=(S.history[0]&&S.history[0].d)||today();
  if(S.premSrc==="gift"&&!giftActive()){ S.premium=false; S.premSrc=null; S.premUntil=null; save(); }   // подарок закончился
  const fromNotif=location.hash==="#notif"&&S.profile;
  if(fromNotif) view="profile";
  if(S.premium && !S.full && S.profile && !fromNotif) view="full";
  render();
  if(fromNotif){ const el=document.getElementById("notifCard"); if(el) el.scrollIntoView({block:"start"}); }
  if(inTg) setTimeout(doSync,1500);
  initMetrika();
})();
